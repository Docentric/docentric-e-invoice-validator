name: Build

on:
  push:
    branches: [ main, develop, feature/** ]
    tags: [ v* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write  # Required for creating GitHub releases
  packages: write  # Required for uploading artifacts

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'
  SOLUTION_PATH: 'src/Docentric.EInvoice.Validator.slnx'
  DOCKER_IMAGE: 'docentric/e-invoice-validator'

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.is_release.outputs.value }}
      is_stable: ${{ steps.is_release.outputs.is_stable }}
      version: ${{ steps.is_release.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

# Determine if this is a release build (v* tag)
    # Sets artifact retention: 90 days for releases, 7 days for dev builds
    - name: Check if release tag
      id: is_release
      run: |
        IS_RELEASE=false
        IS_STABLE_RELEASE=false
        VERSION="0.0.0"  # Default version for non-release builds

        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
          IS_RELEASE=true
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"  # Remove 'v' prefix
          echo "Release build triggered by tag $TAG_NAME"

          # Check if this is a stable release (no prerelease suffix like -preview, -beta, -rc)
          if [[ ! "$VERSION" =~ - ]]; then
            IS_STABLE_RELEASE=true
            echo "This is a stable release (no prerelease suffix)"
          else
            echo "This is a prerelease version"
          fi
        fi

        echo "value=$IS_RELEASE" >> $GITHUB_OUTPUT
        echo "is_stable=$IS_STABLE_RELEASE" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        if [[ "$IS_STABLE_RELEASE" == "true" ]]; then
          echo "artifact_retention_days=90" >> $GITHUB_OUTPUT
        else
          echo "artifact_retention_days=7" >> $GITHUB_OUTPUT
        fi

    # Setup build environment
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/WebUI/package-lock.json

    # Restore dependencies
    - name: Restore .NET dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Install npm dependencies
      working-directory: src/WebUI
      run: npm ci

    # Build and test
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore /p:Version=${{ steps.is_release.outputs.version }} /p:TreatWarningsAsErrors=true

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./test-results
      continue-on-error: true

    # Publish test results and code coverage
    - name: Generate coverage report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@5
      with:
        reports: test-results/**/coverage.cobertura.xml
        targetdir: coverage-report
        reporttypes: Html;MarkdownSummaryGithub

    - name: Add coverage to job summary
      if: always()
      run: |
        if [ -f coverage-report/SummaryGithub.md ]; then
          cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results and coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Test-Results-And-Coverage-${{ steps.is_release.outputs.version }}
        path: |
          test-results/**/*.trx
          test-results/**/coverage.cobertura.xml
          coverage-report/
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    # Publish framework-dependent version (requires .NET runtime on target)
    - name: Publish artifacts
      run: dotnet publish src/Server/RestServer.csproj --configuration Release --no-build --output ./publish/rest-server

    # Publish self-contained versions with embedded runtime for linux-x64 and linux-arm64 (only for release builds)
    - name: Publish self-contained artifacts (linux-x64)
      if: steps.is_release.outputs.value == 'true'
      run: dotnet publish src/Server/RestServer.csproj --configuration Release --self-contained true --runtime linux-x64 /p:Version=${{ steps.is_release.outputs.version }} --output ./publish/rest-server-self-contained-x64

    - name: Publish self-contained artifacts (linux-arm64)
      if: steps.is_release.outputs.value == 'true'
      run: dotnet publish src/Server/RestServer.csproj --configuration Release --self-contained true --runtime linux-arm64 /p:Version=${{ steps.is_release.outputs.version }} --output ./publish/rest-server-self-contained-arm64

    # Upload artifacts with retention based on branch
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    # Self-contained build only uploaded for release builds
    - name: Upload self-contained build artifacts (linux-x64)
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-Self-Contained-x64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-self-contained-x64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload self-contained build artifacts (linux-arm64)
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-Self-Contained-arm64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-self-contained-arm64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    # Upload source code (only for release builds)
    - name: Upload source code
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: Source-${{ steps.is_release.outputs.version }}
        # Includes everything except build and publish folders
        path: |
          .
          !**/bin/
          !**/obj/
          !**/node_modules/
          !**/.vs/
          !.git/
          !publish/
        include-hidden-files: true # needed for the hidden files and folders (starting with ., like .github, .gitignore, etc.)
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    # Create ZIP archives for stable release builds only
    - name: Create ZIP archives
      if: steps.is_release.outputs.is_stable == 'true'
      run: |
        cd publish
        zip -r Docentric.EInvoice.Validator.RestServer-${{ steps.is_release.outputs.version }}.zip rest-server
        zip -r Docentric.EInvoice.Validator.RestServer-Self-Contained-x64-${{ steps.is_release.outputs.version }}.zip rest-server-self-contained-x64
        zip -r Docentric.EInvoice.Validator.RestServer-Self-Contained-arm64-${{ steps.is_release.outputs.version }}.zip rest-server-self-contained-arm64

    # Create GitHub Release with ZIP artifacts (only for stable releases)
    - name: Create GitHub Release
      if: steps.is_release.outputs.is_stable == 'true'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          publish/Docentric.EInvoice.Validator.RestServer-${{ steps.is_release.outputs.version }}.zip
          publish/Docentric.EInvoice.Validator.RestServer-Self-Contained-x64-${{ steps.is_release.outputs.version }}.zip
          publish/Docentric.EInvoice.Validator.RestServer-Self-Contained-arm64-${{ steps.is_release.outputs.version }}.zip
        generate_release_notes: true

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    # QEMU is required to build the linux/arm64 runtime stage on an amd64 runner
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    # Setup Docker with buildx for advanced build features
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Login only for release builds (avoids unnecessary auth for dev builds)
    - name: Log in to Docker Hub
      if: needs.build.outputs.is_release == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Generate Docker tags for release builds (v* tags)
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          # Tag with version from Git tag (e.g., "v1.2.3" -> "1.2.3", "v1.2.3-preview.0" -> "1.2.3-preview.0")
          type=semver,pattern={{version}}
          # Tag "latest" only for stable releases (no prerelease suffix)
          type=raw,value=latest,enable=${{ needs.build.outputs.is_stable == 'true' }}
          # Fallback tag so non-release builds still produce a tag and version
          type=sha

    # Build and push multi-arch Docker image only for v* tags
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ./src
        file: ./src/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ needs.build.outputs.is_release == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Use GitHub Actions cache for faster builds
        cache-from: type=gha
        cache-to: type=gha,mode=max
