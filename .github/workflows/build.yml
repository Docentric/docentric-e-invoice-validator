name: Build

on:
  push:
    branches: [ main, develop, feature/** ]
    tags: [ v* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write  # Required for creating GitHub releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'
  SOLUTION_PATH: 'src/Docentric.EInvoice.Validator.slnx'
  DOCKER_IMAGE: 'docentric/e-invoice-validator'

jobs:
  build:
    name: Build Solution
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      is_release: ${{ steps.is_release.outputs.value }}
      is_stable: ${{ steps.is_release.outputs.is_stable }}
      version: ${{ steps.is_release.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Determine if this is a release build (v* tag)
    # Sets artifact retention: 90 days for stable releases, 7 days for pre-releases and dev builds
    - name: Check if release tag
      id: is_release
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        IS_RELEASE=false
        IS_STABLE_RELEASE=false
        VERSION="0.0.0"  # Default version for non-release builds

        if [[ "$EVENT_NAME" == "push" && "$REF" == refs/tags/v* ]]; then
          IS_RELEASE=true
          TAG_NAME="$REF_NAME"
          VERSION="${TAG_NAME#v}"  # Remove 'v' prefix

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$ ]]; then
            echo "::error::Tag '$TAG_NAME' is not a valid SemVer version (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          echo "Release build triggered by tag $TAG_NAME"

          # Check if this is a stable release (no prerelease suffix like -preview, -beta, -rc)
          if [[ ! "$VERSION" =~ - ]]; then
            IS_STABLE_RELEASE=true
            echo "This is a stable release (no prerelease suffix)"
          else
            echo "This is a prerelease version"
          fi
        fi

        echo "value=$IS_RELEASE" >> "$GITHUB_OUTPUT"
        echo "is_stable=$IS_STABLE_RELEASE" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        if [[ "$IS_STABLE_RELEASE" == "true" ]]; then
          echo "artifact_retention_days=90" >> "$GITHUB_OUTPUT"
        else
          echo "artifact_retention_days=7" >> "$GITHUB_OUTPUT"
        fi

    # Setup build environment
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/WebUI/package-lock.json

    # Restore dependencies
    - name: Restore .NET dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Install npm dependencies
      working-directory: src/WebUI
      run: npm ci

    # Style checks. Non-blocking until the existing violations are fixed; then remove continue-on-error
    - name: Check C# formatting
      continue-on-error: true
      run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --no-restore --verbosity minimal

    - name: Lint web UI
      continue-on-error: true
      working-directory: src/WebUI
      run: npm run lint

    # Build and test
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore /p:Version=${{ steps.is_release.outputs.version }} /p:TreatWarningsAsErrors=true

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./test-results

    # Publish test results and code coverage
    - name: Generate coverage report
      if: always()
      uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5
      with:
        reports: test-results/**/coverage.cobertura.xml
        targetdir: coverage-report
        reporttypes: Html;MarkdownSummaryGithub;Badges

    - name: Add coverage to job summary
      if: always()
      run: |
        if [ -f coverage-report/SummaryGithub.md ]; then
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        fi

    # Publish coverage badge to the 'badges' branch (main only; uses contents: write from workflow permissions)
    - name: Publish coverage badge
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        SVG="$PWD/coverage-report/badge_linecoverage.svg"
        if [ ! -f "$SVG" ]; then
          echo "::warning::Coverage badge was not generated; skipping publish"
          exit 0
        fi
        WORKTREE="$(mktemp -d)"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if git ls-remote --exit-code --heads origin badges > /dev/null; then
          git fetch origin badges
          git worktree add -B badges "$WORKTREE" origin/badges
        else
          git worktree add --detach "$WORKTREE"
          git -C "$WORKTREE" checkout --orphan badges
          git -C "$WORKTREE" rm -rf --quiet .
        fi
        cp "$SVG" "$WORKTREE/ci-coverage.svg"
        cd "$WORKTREE"
        git add ci-coverage.svg
        if git diff --cached --quiet; then
          echo "Coverage badge unchanged"
        else
          git commit -m "Update coverage badge"
          git push origin badges
        fi

    - name: Upload test results and coverage
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Test-Results-And-Coverage-${{ steps.is_release.outputs.version }}
        path: |
          test-results/**/*.trx
          test-results/**/coverage.cobertura.xml
          coverage-report/
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    # Publish all platforms in Release configuration only. Framework-dependent for every build,
    # self-contained only for release builds. The matching Java install script is added to each package.
    - name: Publish artifacts
      env:
        VERSION: ${{ steps.is_release.outputs.version }}
        IS_RELEASE: ${{ steps.is_release.outputs.value }}
      run: |
        set -euo pipefail
        for RID in linux-x64 linux-arm64 win-x64 win-arm64 osx-x64 osx-arm64; do
          OS="${RID%%-*}"
          case "$OS" in
            win)   SCRIPT_SRC="scripts/java/install-java.ps1";       SCRIPT_DST="install-java.ps1" ;;
            osx)   SCRIPT_SRC="scripts/java/install-java-macos.sh";  SCRIPT_DST="install-java.sh" ;;
            linux) SCRIPT_SRC="scripts/java/install-java-linux.sh";  SCRIPT_DST="install-java.sh" ;;
          esac

          for VARIANT in framework-dependent self-contained; do
            if [[ "$VARIANT" == "self-contained" ]]; then
              [[ "$IS_RELEASE" == "true" ]] || continue
              SC_ARGS=(--self-contained true)
              OUT="publish/rest-server-self-contained-$RID"
            else
              SC_ARGS=(--self-contained false)
              OUT="publish/rest-server-$RID"
            fi

            dotnet publish src/Server/RestServer.csproj --configuration Release "${SC_ARGS[@]}" --runtime "$RID" /p:Version="$VERSION" --output "./$OUT"
            cp "$SCRIPT_SRC" "$OUT/$SCRIPT_DST"
            if [[ "$SCRIPT_DST" == *.sh ]]; then chmod +x "$OUT/$SCRIPT_DST"; fi
          done
        done

    # Upload artifacts (retention depends on release type, see is_release step)
    - name: Upload build artifacts (linux-x64)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-linux-x64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-linux-x64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload build artifacts (linux-arm64)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-linux-arm64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-linux-arm64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload build artifacts (win-x64)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-win-x64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-win-x64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload build artifacts (win-arm64)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-win-arm64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-win-arm64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload build artifacts (osx-x64)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-osx-x64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-osx-x64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload build artifacts (osx-arm64)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-osx-arm64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-osx-arm64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    # Self-contained builds only uploaded for release builds
    - name: Upload self-contained build artifacts (linux-x64)
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-Self-Contained-linux-x64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-self-contained-linux-x64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload self-contained build artifacts (linux-arm64)
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-Self-Contained-linux-arm64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-self-contained-linux-arm64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload self-contained build artifacts (win-x64)
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-Self-Contained-win-x64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-self-contained-win-x64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload self-contained build artifacts (win-arm64)
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-Self-Contained-win-arm64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-self-contained-win-arm64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload self-contained build artifacts (osx-x64)
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-Self-Contained-osx-x64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-self-contained-osx-x64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    - name: Upload self-contained build artifacts (osx-arm64)
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Docentric.EInvoice.Validator.RestServer-Self-Contained-osx-arm64-${{ steps.is_release.outputs.version }}
        path: ./publish/rest-server-self-contained-osx-arm64
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    # Upload source code (only for release builds)
    - name: Upload source code
      if: steps.is_release.outputs.value == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: Source-${{ steps.is_release.outputs.version }}
        # Includes everything except build and publish folders
        path: |
          .
          !**/bin/
          !**/obj/
          !**/node_modules/
          !**/.vs/
          !.git/
          !publish/
          !test-results/
          !coverage-report/
        include-hidden-files: true # needed for the hidden files and folders (starting with ., like .github, .gitignore, etc.)
        retention-days: ${{ steps.is_release.outputs.artifact_retention_days }}

    # Create ZIP archives for release builds (zip keeps the executable bit of the install scripts)
    - name: Create ZIP archives
      if: steps.is_release.outputs.value == 'true'
      env:
        VERSION: ${{ steps.is_release.outputs.version }}
      run: |
        set -euo pipefail
        cd publish
        for RID in linux-x64 linux-arm64 win-x64 win-arm64 osx-x64 osx-arm64; do
          zip -r "Docentric.EInvoice.Validator.RestServer-$RID-$VERSION.zip" "rest-server-$RID"
          zip -r "Docentric.EInvoice.Validator.RestServer-Self-Contained-$RID-$VERSION.zip" "rest-server-self-contained-$RID"
        done

    # Create GitHub Release with ZIP artifacts (pre-releases are marked as such)
    - name: Create GitHub Release
      if: steps.is_release.outputs.value == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        files: publish/*.zip
        generate_release_notes: true
        prerelease: ${{ steps.is_release.outputs.is_stable != 'true' }}

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # QEMU is required to build the linux/arm64 runtime stage on an amd64 runner (release builds only)
    - name: Set up QEMU
      if: needs.build.outputs.is_release == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    # Setup Docker with buildx for advanced build features
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    # Login only for release builds (avoids unnecessary auth for dev builds)
    - name: Log in to Docker Hub
      if: needs.build.outputs.is_release == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Generate Docker tags for release builds (v* tags)
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          # Tag with version from Git tag (e.g., "v1.2.3" -> "1.2.3", "v1.2.3-preview.0" -> "1.2.3-preview.0")
          type=semver,pattern={{version}}
          # Tag "latest" only for stable releases (no prerelease suffix)
          type=raw,value=latest,enable=${{ needs.build.outputs.is_stable == 'true' }}
          # Fallback tag so non-release builds still produce a tag and version (not pushed on releases)
          type=sha,enable=${{ needs.build.outputs.is_release != 'true' }}

    # Build the image on every run; multi-arch and push only for v* tags
    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ./src
        file: ./src/Dockerfile
        platforms: ${{ needs.build.outputs.is_release == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
        push: ${{ needs.build.outputs.is_release == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Use GitHub Actions cache for faster builds
        cache-from: type=gha
        cache-to: type=gha,mode=max
